      <text x="299.75" y="957" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Comparing</text>
      <text x="299.75" y="973" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Outputs (9.3)</text>
    </g>
    <rect x="241.25" y="1057" width="132" height="36" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="307.25" y="1079" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Stream (7.x)</text>
    <rect x="257.25" y="1171" width="100" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="307.25" y="1193" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Report</text>
    <rect x="40" y="1048" width="150" height="54" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="115" y="1071" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Usage Tracking</text>
      <text x="115" y="1087" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">(2.2)</text>
    <rect x="44.5" y="1162" width="141" height="54" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
