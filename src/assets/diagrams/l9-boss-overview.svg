    <path d="M 206.18421052631578,646 L 162.5,676 L 162.5,733 L 162.5,790 L 162.5,847 L 162.5,904 L 162.5,961 L 162.5,1018 L 137.5,1048" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 263.9868421052631,988 L 224.25,1018 L 166.75,1048" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 115,1102 L 115,1132 L 115,1162" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Nodes -->
  <rect x="133.5" y="40" width="114" height="36" rx="10" fill="url(#grad-input)" filter="url(#shadow)"/>
      <text x="190.5" y="62" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">User Input</text>
