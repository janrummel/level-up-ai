      <text x="299.75" y="729" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Structured Output</text>
      <text x="299.75" y="745" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">(1.5)</text>
    </g>
    <g filter="url(#glow-red)">
