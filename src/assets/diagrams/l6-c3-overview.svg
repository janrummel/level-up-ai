<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1094 177" role="img" aria-label="l6-c3-overview">
  <defs>
  <!-- Gradients -->
  <linearGradient id="grad-input" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5B9FE6"/>
    <stop offset="100%" stop-color="#3A7BD5"/>
  </linearGradient>
  <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#43C67A"/>
    <stop offset="100%" stop-color="#27AE60"/>
  </linearGradient>
  <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F0944D"/>
    <stop offset="100%" stop-color="#E67E22"/>
  </linearGradient>
  <linearGradient id="grad-warning" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EF6B6B"/>
    <stop offset="100%" stop-color="#E74C3C"/>
  </linearGradient>
  <linearGradient id="grad-neutral" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#3A7BD5" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#27AE60" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E67E22" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E74C3C" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Shadow filter -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
  </filter>

  <!-- Arrow marker -->
  <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
  </marker>
</defs>
  <rect width="1094" height="177" fill="#0f172a" rx="16"/>
  <!-- Groups -->
  <text x="787" y="45.5" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Du bist HIER: LLM-as-a-Judge</text>
    <rect x="508" y="49.5" width="558" height="78" rx="6" stroke="#E67E22" stroke-dasharray="5 5" fill="none" stroke-width="2"/>
  <!-- Edges -->
  <path d="M 140,119 L 170,119 L 200,119" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 300,119 L 330,119 L 360,119" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 460,119 L 490,119 L 523.811475409836,106.5" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 460,58 L 490,58 L 523.811475409836,70.5" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 625,88.5 L 655,88.5 L 685,88.5" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 853,88.5 L 883,88.5 L 913,88.5" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Nodes -->
  <rect x="40" y="101" width="100" height="36" rx="10" fill="url(#grad-input)" filter="url(#shadow)"/>
      <text x="90" y="123" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Input</text>
    <rect x="360" y="40" width="100" height="36" rx="10" fill="url(#grad-input)" filter="url(#shadow)"/>
      <text x="410" y="62" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Expected</text>
    <rect x="200" y="101" width="100" height="36" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="250" y="123" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">task()</text>
    <g filter="url(#glow-green)">
      <rect x="520" y="70.5" width="105" height="36" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="572.5" y="92.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Judge LLM</text>
    </g>
    <g filter="url(#glow-orange)">
      <rect x="685" y="61.5" width="168" height="54" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="769" y="84.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Structured Score</text>
      <text x="769" y="100.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">(A-E)</text>
    </g>
    <g filter="url(#glow-orange)">
      <rect x="913" y="61.5" width="141" height="54" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="983.5" y="84.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Numeric Score</text>
      <text x="983.5" y="100.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">(0-1)</text>
    </g>
    <rect x="360" y="101" width="100" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="410" y="123" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Output</text>
</svg>