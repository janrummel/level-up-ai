<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 458" role="img" aria-label="l8-c3-overview">
  <defs>
  <!-- Gradients -->
  <linearGradient id="grad-input" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5B9FE6"/>
    <stop offset="100%" stop-color="#3A7BD5"/>
  </linearGradient>
  <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#43C67A"/>
    <stop offset="100%" stop-color="#27AE60"/>
  </linearGradient>
  <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F0944D"/>
    <stop offset="100%" stop-color="#E67E22"/>
  </linearGradient>
  <linearGradient id="grad-warning" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EF6B6B"/>
    <stop offset="100%" stop-color="#E74C3C"/>
  </linearGradient>
  <linearGradient id="grad-neutral" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#3A7BD5" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#27AE60" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E67E22" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E74C3C" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Shadow filter -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
  </filter>

  <!-- Arrow marker -->
  <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
  </marker>
</defs>
  <rect width="444" height="458" fill="#0f172a" rx="16"/>
  <!-- Groups -->
  <text x="230.25" y="138" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Du bist HIER: Custom Loop</text>
    <rect x="44.5" y="142" width="371.5" height="288" rx="6" stroke="#E67E22" stroke-dasharray="5 5" fill="none" stroke-width="2"/>
  <!-- Edges -->
  <path d="M 216.75,94 L 216.75,124 L 216.75,154" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 174.23684210526315,208 L 127,238 L 127,268" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 163.46875,304 L 224.25,334 L 271.4868421052631,364" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 317.55263157894734,364 L 321.5,334 L 321.5,286 L 321.5,238 L 266.36842105263156,208" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 124.1875,304 L 119.5,334 L 119.5,373" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Nodes -->
  <rect x="126.75" y="40" width="180" height="54" rx="10" fill="url(#grad-input)" filter="url(#shadow)"/>
      <text x="216.75" y="63" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Initialize</text>
      <text x="216.75" y="79" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">messages = [user prompt]</text>
    <g filter="url(#glow-green)">
      <rect x="141.75" y="154" width="150" height="54" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="216.75" y="177" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">generateText()</text>
      <text x="216.75" y="193" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">mit Tools</text>
    </g>
    <g filter="url(#glow-green)">
      <rect x="56.5" y="268" width="141" height="36" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="127" y="290" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">finishReason?</text>
    </g>
    <g filter="url(#glow-green)">
      <rect x="224" y="364" width="180" height="54" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="314" y="387" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Messages aktualisieren</text>
      <text x="314" y="403" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">+ State tracken</text>
    </g>
    <rect x="40" y="373" width="159" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="119.5" y="395" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Return Ergebnis</text>
</svg>