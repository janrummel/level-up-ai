<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 134" role="img" aria-label="l7-c3-combine">
  <defs>
  <!-- Gradients -->
  <linearGradient id="grad-input" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5B9FE6"/>
    <stop offset="100%" stop-color="#3A7BD5"/>
  </linearGradient>
  <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#43C67A"/>
    <stop offset="100%" stop-color="#27AE60"/>
  </linearGradient>
  <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F0944D"/>
    <stop offset="100%" stop-color="#E67E22"/>
  </linearGradient>
  <linearGradient id="grad-warning" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EF6B6B"/>
    <stop offset="100%" stop-color="#E74C3C"/>
  </linearGradient>
  <linearGradient id="grad-neutral" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#3A7BD5" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#27AE60" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E67E22" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E74C3C" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Shadow filter -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
  </filter>

  <!-- Arrow marker -->
  <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
  </marker>
</defs>
  <rect width="984" height="134" fill="#0f172a" rx="16"/>
  <!-- Groups -->
  
  <!-- Edges -->
  <path d="M 172,67 L 202,67 L 232,67" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 382,67 L 412,67 L 442,67" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 592,67 L 622,67 L 652,67" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 784,67 L 814,67 L 844,67" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Nodes -->
  <rect x="40" y="40" width="132" height="54" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="106" y="63" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">streamText()</text>
      <text x="106" y="79" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">(1.4)</text>
    <rect x="232" y="40" width="150" height="54" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="307" y="63" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">smoothStream()</text>
      <text x="307" y="79" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">(7.3)</text>
    <rect x="442" y="40" width="150" height="54" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="517" y="63" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">redactEmails()</text>
      <text x="517" y="79" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">(7.3)</text>
    <rect x="652" y="40" width="132" height="54" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="718" y="63" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">+ Data Parts</text>
      <text x="718" y="79" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">(7.1)</text>
    <rect x="844" y="49" width="100" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="894" y="71" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Frontend</text>
</svg>