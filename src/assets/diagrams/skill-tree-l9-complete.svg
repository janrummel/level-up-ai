<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140">
<defs>
  <!-- Gradients -->
  <linearGradient id="grad-input" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5B9FE6"/>
    <stop offset="100%" stop-color="#4A90D9"/>
  </linearGradient>
  <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#43C67A"/>
    <stop offset="100%" stop-color="#27AE60"/>
  </linearGradient>
  <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F0944D"/>
    <stop offset="100%" stop-color="#E67E22"/>
  </linearGradient>
  <linearGradient id="grad-warning" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EF6B6B"/>
    <stop offset="100%" stop-color="#E74C3C"/>
  </linearGradient>
  <linearGradient id="grad-neutral" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#4A90D9" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#27AE60" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E67E22" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E74C3C" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Shadow filter -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
  </filter>

  <!-- Arrow marker -->
  <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="800" height="140" fill="#0f172a" rx="12"/>
<text x="400" y="40" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">Freigeschaltet</text>
<path d="M 97.5 77.5 L 107.5 77.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 182.5 77.5 L 192.5 77.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 267.5 77.5 L 277.5 77.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 352.5 77.5 L 362.5 77.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 437.5 77.5 L 447.5 77.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 522.5 77.5 L 532.5 77.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 607.5 77.5 L 617.5 77.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 692.5 77.5 L 702.5 77.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#glow-green)">
<rect x="22.5" y="55" width="75" height="45" rx="6" fill="url(#grad-process)" filter="url(#shadow)"/>
<text x="60" y="72" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 1</text>
<text x="60" y="88" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" textLength="67" lengthAdjust="spacingAndGlyphs">AI SDK Basics</text>
</g>
