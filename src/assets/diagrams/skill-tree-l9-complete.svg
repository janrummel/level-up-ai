<text x="655" y="72" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 8</text>
<text x="655" y="88" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Workflows</text>
</g>
