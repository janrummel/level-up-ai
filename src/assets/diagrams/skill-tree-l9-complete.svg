<text x="315" y="72" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 4</text>
<text x="315" y="88" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" textLength="67" lengthAdjust="spacingAndGlyphs">Persistence</text>
</g>
