<text x="230" y="88" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" textLength="67" lengthAdjust="spacingAndGlyphs">Agents &amp; MCP</text>
</g>
