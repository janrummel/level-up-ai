<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1127 116" role="img" aria-label="l4-c1-timing">
  <defs>
  <!-- Gradients -->
  <linearGradient id="grad-input" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5B9FE6"/>
    <stop offset="100%" stop-color="#3A7BD5"/>
  </linearGradient>
  <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#43C67A"/>
    <stop offset="100%" stop-color="#27AE60"/>
  </linearGradient>
  <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F0944D"/>
    <stop offset="100%" stop-color="#E67E22"/>
  </linearGradient>
  <linearGradient id="grad-warning" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EF6B6B"/>
    <stop offset="100%" stop-color="#E74C3C"/>
  </linearGradient>
  <linearGradient id="grad-neutral" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#3A7BD5" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#27AE60" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E67E22" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E74C3C" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Shadow filter -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
  </filter>

  <!-- Arrow marker -->
  <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
  </marker>
</defs>
  <rect width="1127" height="116" fill="#0f172a" rx="16"/>
  <!-- Groups -->
  
  <!-- Edges -->
  <path d="M 220,58 L 250,58 L 280,58" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 421,58 L 451,58 L 481,58" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 658,58 L 688,58 L 718,58" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 877,58 L 907,58 L 937,58" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Nodes -->
  <rect x="40" y="40" width="180" height="36" rx="10" fill="url(#grad-input)" filter="url(#shadow)"/>
      <text x="130" y="62" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">generateText() startet</text>
    <rect x="280" y="40" width="141" height="36" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="350.5" y="62" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">LLM generiert</text>
    <rect x="481" y="40" width="177" height="36" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="569.5" y="62" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Completion fertig</text>
    <rect x="718" y="40" width="159" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="797.5" y="62" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">onFinish feuert</text>
    <rect x="937" y="40" width="150" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="1012" y="62" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">await resolved</text>
</svg>