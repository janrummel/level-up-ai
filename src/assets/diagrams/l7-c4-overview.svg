<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 573 632" role="img" aria-label="l7-c4-overview">
  <defs>
  <!-- Gradients -->
  <linearGradient id="grad-input" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5B9FE6"/>
    <stop offset="100%" stop-color="#3A7BD5"/>
  </linearGradient>
  <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#43C67A"/>
    <stop offset="100%" stop-color="#27AE60"/>
  </linearGradient>
  <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F0944D"/>
    <stop offset="100%" stop-color="#E67E22"/>
  </linearGradient>
  <linearGradient id="grad-warning" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EF6B6B"/>
    <stop offset="100%" stop-color="#E74C3C"/>
  </linearGradient>
  <linearGradient id="grad-neutral" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>

  <!-- Glow filters -->
  <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#3A7BD5" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#27AE60" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E67E22" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feFlood flood-color="#E74C3C" flood-opacity="0.3"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Shadow filter -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
  </filter>

  <!-- Arrow marker -->
  <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
  </marker>
</defs>
  <rect width="573" height="632" fill="#0f172a" rx="16"/>
  <!-- Groups -->
  <text x="303.5" y="330" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Du bist HIER: Error Handling</text>
    <rect x="62" y="334" width="483" height="174" rx="6" stroke="#E67E22" stroke-dasharray="5 5" fill="none" stroke-width="2"/>
  <!-- Edges -->
  <path d="M 300.28125,76 L 345.75,106 L 345.75,136" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 374.34375,172 L 422,202 L 422,232" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 317.15625,172 L 269.5,202 L 269.5,241" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 269.5,277 L 269.5,316 L 269.5,346" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 336.8125,382 L 449,412 L 449,442" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 269.5,382 L 269.5,412 L 269.5,451" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 234.4375,382 L 176,412 L 140.42105263157896,451" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 121.63157894736842,451 L 116.5,412 L 116.5,364 L 116.5,316 L 116.5,259 L 116.5,202 L 116.5,154 L 116.5,106 L 214.3125,76" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 124,487 L 124,526 L 124,556" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Nodes -->
  <rect x="207" y="40" width="132" height="36" rx="10" fill="url(#grad-input)" filter="url(#shadow)"/>
      <text x="273" y="62" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">streamText()</text>
    <rect x="275.25" y="136" width="141" height="36" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="345.75" y="158" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Stream laeuft</text>
    <rect x="356" y="232" width="132" height="54" rx="10" fill="url(#grad-process)" filter="url(#shadow)"/>
      <text x="422" y="255" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">finish Event</text>
      <text x="422" y="271" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Alles gut</text>
    <rect x="208" y="241" width="123" height="36" rx="10" fill="url(#grad-warning)" filter="url(#shadow)"/>
      <text x="269.5" y="263" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Error Event</text>
    <g filter="url(#glow-orange)">
      <rect x="185.5" y="346" width="168" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="269.5" y="368" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">onError Callback</text>
    </g>
    <g filter="url(#glow-orange)">
      <rect x="365" y="442" width="168" height="54" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="449" y="465" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">User-freundliche</text>
      <text x="449" y="481" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Fehlermeldung</text>
    </g>
    <g filter="url(#glow-orange)">
      <rect x="199" y="451" width="141" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="269.5" y="473" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Error Logging</text>
    </g>
    <g filter="url(#glow-orange)">
      <rect x="74" y="451" width="100" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="124" y="473" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Retry?</text>
    </g>
    <rect x="40" y="556" width="168" height="36" rx="10" fill="url(#grad-output)" filter="url(#shadow)"/>
      <text x="124" y="578" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Fallback-Antwort</text>
</svg>