<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none" role="img" aria-label="Skill Tree Roadmap — 9 Level vom Vibe Coder zum AI Engineer">
  <title>Skill Tree Roadmap</title>
  <desc>Interaktive Roadmap mit 9 Leveln in 4 Schwierigkeitsstufen: Grundlagen (blau), Aufbau (gruen), Fortgeschritten (orange) und Experte (rot). Zeigt Abhaengigkeiten zwischen den Leveln.</desc>
  <defs>
    <!-- Gradients for level tiers -->
    <linearGradient id="grad-basics" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9FE6"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
    <linearGradient id="grad-intermediate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43C67A"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <linearGradient id="grad-advanced" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0944D"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <linearGradient id="grad-expert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF6B6B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#4A90D9" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#27AE60" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#E67E22" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#E74C3C" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="#0f172a"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="520"/>
    <line x1="300" y1="0" x2="300" y2="520"/>
    <line x1="450" y1="0" x2="450" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="750" y1="0" x2="750" y2="520"/>
  </g>

  <!-- Connection lines (drawn first, behind nodes) -->
  <!-- L1 → L2 -->
  <path d="M 195 140 C 250 140, 250 100, 305 100" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- L1 → L4 -->
  <path d="M 195 140 C 250 140, 250 260, 305 260" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- L1 → L7 -->
  <path d="M 195 140 C 250 140, 250 420, 305 420" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- L2 → L3 -->
  <path d="M 435 100 C 490 100, 490 100, 545 100" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- L2 → L5 -->
  <path d="M 435 100 C 490 100, 490 260, 545 260" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- L3 → L8 -->
  <path d="M 675 100 C 715 100, 715 340, 545 380 C 520 385, 520 420, 545 420" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/>
  <!-- L5 → L6 -->
  <path d="M 675 260 C 710 260, 710 260, 740 260" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 740 260 C 770 260, 770 260, 770 320 C 770 370, 770 380, 770 380" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- L7 → L8 -->
  <path d="M 435 420 C 490 420, 490 420, 545 420" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- L8 → L9 (final) -->
  <path d="M 675 420 C 730 420, 730 420, 740 420" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- L6 → L9 -->
  <!-- Both L6 and L8 feed into L9 -->

  <!-- === NODES === -->

  <!-- Level 1: AI SDK Basics (Basics - Blue) -->
  <g filter="url(#glow-blue)">
    <rect x="55" y="105" width="140" height="70" rx="12" fill="url(#grad-basics)" filter="url(#shadow)"/>
    <text x="125" y="132" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 1</text>
    <text x="125" y="153" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">AI SDK Basics</text>
  </g>

  <!-- Level 2: LLM Fundamentals (Basics - Blue) -->
  <g filter="url(#glow-blue)">
    <rect x="305" y="65" width="130" height="70" rx="12" fill="url(#grad-basics)" filter="url(#shadow)"/>
    <text x="370" y="92" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 2</text>
    <text x="370" y="113" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">LLM Fundamentals</text>
  </g>

  <!-- Level 3: Agents & MCP (Intermediate - Green) -->
  <g filter="url(#glow-green)">
    <rect x="545" y="65" width="130" height="70" rx="12" fill="url(#grad-intermediate)" filter="url(#shadow)"/>
    <text x="610" y="92" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 3</text>
    <text x="610" y="113" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Agents &amp; MCP</text>
  </g>

  <!-- Level 4: Persistence (Intermediate - Green) -->
  <g filter="url(#glow-green)">
    <rect x="305" y="225" width="130" height="70" rx="12" fill="url(#grad-intermediate)" filter="url(#shadow)"/>
    <text x="370" y="252" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 4</text>
    <text x="370" y="273" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Persistence</text>
  </g>

  <!-- Level 5: Context Engineering (Intermediate - Green) -->
  <g filter="url(#glow-green)">
    <rect x="545" y="225" width="130" height="70" rx="12" fill="url(#grad-intermediate)" filter="url(#shadow)"/>
    <text x="610" y="252" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 5</text>
    <text x="610" y="273" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Context Eng.</text>
  </g>

  <!-- Level 6: Evals (Advanced - Orange) -->
  <g filter="url(#glow-orange)">
    <rect x="720" y="310" width="130" height="70" rx="12" fill="url(#grad-advanced)" filter="url(#shadow)"/>
    <text x="785" y="337" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 6</text>
    <text x="785" y="358" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Evals</text>
  </g>

  <!-- Level 7: Streaming (Advanced - Orange) -->
  <g filter="url(#glow-orange)">
    <rect x="305" y="385" width="130" height="70" rx="12" fill="url(#grad-advanced)" filter="url(#shadow)"/>
    <text x="370" y="412" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 7</text>
    <text x="370" y="433" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Streaming</text>
  </g>

  <!-- Level 8: Workflows (Advanced - Orange) -->
  <g filter="url(#glow-orange)">
    <rect x="545" y="385" width="130" height="70" rx="12" fill="url(#grad-advanced)" filter="url(#shadow)"/>
    <text x="610" y="412" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 8</text>
    <text x="610" y="433" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Workflows</text>
  </g>

  <!-- Level 9: Advanced Patterns (Expert - Red) -->
  <g filter="url(#glow-red)">
    <rect x="720" y="385" width="130" height="70" rx="12" fill="url(#grad-expert)" filter="url(#shadow)"/>
    <text x="785" y="412" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.7">LEVEL 9</text>
    <text x="785" y="433" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Advanced</text>
  </g>

  <!-- Reworked connections for L5→L6 and L6/L8→L9 -->
  <!-- L5 → L6: curve down-right -->
  <path d="M 675 270 Q 700 270 710 290 Q 720 310 720 340" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>

  <!-- L6 → L9 -->
  <path d="M 785 380 L 785 385" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- L8 → L9 -->
  <path d="M 675 420 L 720 420" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(55, 480)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#grad-basics)"/>
    <text x="20" y="11" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Grundlagen</text>

    <rect x="120" y="0" width="14" height="14" rx="3" fill="url(#grad-intermediate)"/>
    <text x="140" y="11" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Aufbau</text>

    <rect x="220" y="0" width="14" height="14" rx="3" fill="url(#grad-advanced)"/>
    <text x="240" y="11" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fortgeschritten</text>

    <rect x="370" y="0" width="14" height="14" rx="3" fill="url(#grad-expert)"/>
    <text x="390" y="11" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Experte</text>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">Skill Tree</text>
  <text x="450" y="56" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">Vom Vibe Coder zum AI Engineer</text>
</svg>
